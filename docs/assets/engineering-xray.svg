    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#213146" stroke-width=".6"/></pattern>
    <linearGradient id="background" x2="1" y2=".5"><stop stop-color="#0d1726"/><stop offset="1" stop-color="#14253a"/></linearGradient>
  </defs>
  <rect width="1200" height="172" rx="12" fill="url(#background)"/>
  <rect width="1200" height="172" rx="12" fill="url(#grid)" opacity=".65"/>
  <path d="M0 42V130" stroke="#79d6ff" stroke-width="5"/>
